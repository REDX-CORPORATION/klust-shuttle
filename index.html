<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLUST Shuttle</title>
<meta name="description" content="Live shuttle tracking, seat reservations and e-tickets for Kuala Lumpur University of Science and Technology.">
<meta name="theme-color" content="#12305C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="https://i.ibb.co/G3sqM6c3/images-1-removebg-preview.png" type="image/png">
<link rel="apple-touch-icon" href="https://i.ibb.co/G3sqM6c3/images-1-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#F7F9FB;--sunk:#E9EDF2;--ink:#0F1B2D;--ink-2:#34445A;--muted:#66768A;--line:#DDE3EA;--line-2:#ECEFF3;
  --brand:#12305C;--brand-soft:#E7EEF8;--primary:#12305C;--primary-h:#0B2346;--on-primary:#fff;--focus:#2F6FEB;
  --ok:#157A48;--ok-bg:#E2F3E9;--warn:#995A00;--warn-bg:#FCEFD8;--danger:#C2261B;--danger-bg:#FBE5E2;--info:#1E5BB8;--info-bg:#E4EDFA;
  --map-bg:#E8EBEE;--case:#FFFFFF;--halo:#FFFFFF;--heat:36,89,214;
  --sh-1:0 1px 2px rgba(15,27,45,.06),0 1px 1px rgba(15,27,45,.04);--sh-2:0 8px 24px rgba(15,27,45,.10),0 2px 6px rgba(15,27,45,.06);--sh-3:0 24px 60px rgba(15,27,45,.22);
  --nav-h:64px;--side:248px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.35,.64,1);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#0C131D;--surface:#131D2A;--surface-2:#182434;--sunk:#0A1018;--ink:#E7EDF5;--ink-2:#BAC6D4;--muted:#8697AB;--line:#25344A;--line-2:#1C293A;--brand:#9DBDF2;--brand-soft:#1A2B45;--primary:#3B6ED3;--primary-h:#325FBA;--ok:#4CC38A;--ok-bg:#11301F;--warn:#F0B44C;--warn-bg:#33260F;--danger:#FF7B6F;--danger-bg:#3A1714;--info:#80B1FF;--info-bg:#132640;--map-bg:#1A222C;--case:#0F1620;--halo:#101820;--heat:128,176,255;--sh-2:0 8px 24px rgba(0,0,0,.4);--sh-3:0 24px 60px rgba(0,0,0,.55);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C131D;--surface:#131D2A;--surface-2:#182434;--sunk:#0A1018;--ink:#E7EDF5;--ink-2:#BAC6D4;--muted:#8697AB;--line:#25344A;--line-2:#1C293A;--brand:#9DBDF2;--brand-soft:#1A2B45;--primary:#3B6ED3;--primary-h:#325FBA;--ok:#4CC38A;--ok-bg:#11301F;--warn:#F0B44C;--warn-bg:#33260F;--danger:#FF7B6F;--danger-bg:#3A1714;--info:#80B1FF;--info-bg:#132640;--map-bg:#1A222C;--case:#0F1620;--halo:#101820;--heat:128,176,255;--sh-2:0 8px 24px rgba(0,0,0,.4);--sh-3:0 24px 60px rgba(0,0,0,.55);color-scheme:dark}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p,ol,ul,dl,dd{margin:0}ol,ul{padding:0;list-style:none}
h1{font-size:20px;font-weight:750;letter-spacing:-.01em}h2{font-size:19px;font-weight:750;letter-spacing:-.01em}h3{font-size:15.5px;font-weight:700}h4{font-size:15px;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--brand)}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}.center{text-align:center}.block{display:block}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}.stack-l{display:flex;flex-direction:column;gap:16px}
.t-danger{color:var(--danger)}.t-warn{color:var(--warn)}.t-ok{color:var(--ok)}
.sec{font-size:13.5px;font-weight:700;color:var(--muted);margin:22px 2px 8px}
.grp{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}.hint .ico{width:16px;height:16px;margin-top:2px}

/* ---------- Logo (hotlinked image with text fallback) ---------- */
.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:#fff;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(15,27,45,.08)}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.logo>.logo-txt{display:none;font-size:10px;font-weight:800;letter-spacing:.02em;color:#fff}
.logo.nologo{background:#12305C;box-shadow:none}.logo.nologo>img{display:none}.logo.nologo>.logo-txt{display:block}
.logo.lg{width:68px;height:68px;border-radius:18px}.logo.lg img{padding:5px}.logo.lg>.logo-txt{font-size:15px}

/* ---------- Buttons and controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--sunk);color:var(--ink);border:1px solid transparent;transition:transform .12s var(--ease),background-color .2s,border-color .2s,box-shadow .2s;white-space:nowrap;text-decoration:none;flex-shrink:0}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--primary);color:var(--on-primary)}.btn.primary:hover:not(:disabled){background:var(--primary-h)}
.btn.ghost{background:transparent;border-color:var(--line)}.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-t{color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}.btn.lg{height:52px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink-2);transition:background-color .2s,transform .12s}
.iconbtn:hover{background:var(--sunk)}.iconbtn:active{transform:scale(.94)}.iconbtn:disabled{opacity:.35}
.iconbtn.lg{width:54px;height:54px;border-radius:14px;background:var(--sunk)}.iconbtn.primary{background:var(--primary);color:#fff}.iconbtn.primary:hover{background:var(--primary-h)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}.iconbtn.sm .ico{width:16px;height:16px}
.linkbtn{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:650;padding:6px 0;font-size:14px}
.linkbtn .ico{width:18px;height:18px}.linkbtn.back{margin-bottom:4px}
.linkbtn.subtle{color:var(--muted);font-size:13px;margin:4px auto 0;display:block;font-weight:600}
.dot-badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.seg{display:flex;gap:2px;padding:3px;background:var(--sunk);border-radius:12px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--ink-2);transition:background-color .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg.sm button{height:30px;font-size:12.5px;padding:0 10px}.seg.big button{height:48px;font-size:15px}
.seg.big button.emergency[aria-pressed=true]{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.static{cursor:default;height:30px;font-size:12.5px}
.chip-s{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--sunk);color:var(--ink-2);white-space:nowrap;flex:none}
.chip-s .ico{width:14px;height:14px}
.chip-s.ok{background:var(--ok-bg);color:var(--ok)}.chip-s.warn{background:var(--warn-bg);color:var(--warn)}.chip-s.danger{background:var(--danger-bg);color:var(--danger)}.chip-s.info{background:var(--info-bg);color:var(--info)}
.tag{font-size:12px;color:var(--muted);background:var(--sunk);padding:2px 8px;border-radius:6px}
.rb{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;background:var(--c);color:#fff;font-weight:800;font-size:12.5px;flex:none;letter-spacing:.01em}
.rb.lt{color:#231700}.rb.lg{min-width:42px;height:36px;border-radius:10px;font-size:15px}.rb.xs{min-width:22px;height:18px;font-size:10.5px;border-radius:5px;padding:0 4px}
.field{display:flex;flex-direction:column;gap:6px}.field>span:first-child{font-size:13px;font-weight:650;color:var(--ink-2)}
.input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:15.5px;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
textarea.input{height:auto;padding:12px 14px;resize:vertical;line-height:1.45}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input.sm{height:36px;font-size:13.5px;padding:0 10px;border-radius:10px}.input.lg{height:54px;font-size:18px;font-weight:650;letter-spacing:.03em}
.pw{position:relative;display:block}.pw .input{padding-right:50px}.pw-eye{position:absolute;right:3px;top:3px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.errtxt{color:var(--danger);font-size:13.5px;font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;flex:none}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background-color .25s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true] i{transform:translateX(20px)}
.meter{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .6s var(--ease)}.meter.warn i{background:var(--warn)}.meter.danger i{background:var(--danger)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22A162;margin-right:6px;vertical-align:1px;animation:live 2s infinite}

/* ---------- Lists and cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.card-head.wrap{flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.card-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;transition:background-color .15s}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 12%,var(--surface-2) 88%,transparent)}
.lrow b{display:block;font-weight:650;font-size:14.5px;line-height:1.3}.lrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.lrow>.ico{color:var(--muted);width:18px;height:18px}
.lrow-ico{width:38px;height:38px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.lrow-ico .ico{width:19px;height:19px}.lrow-ico.t-danger{background:var(--danger-bg)}.lrow-ico.t-warn{background:var(--warn-bg)}.lrow-ico.t-info{background:var(--info-bg);color:var(--info)}
.tick{color:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 16px;color:var(--muted)}
.empty>.ico{width:36px;height:36px;margin-bottom:10px;stroke-width:1.6}.empty b{color:var(--ink);font-size:15.5px}.empty p{font-size:13.5px;margin-top:4px;max-width:34ch}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px}.banner.danger{background:var(--danger-bg);color:var(--danger)}
.plist{display:flex;flex-direction:column;gap:12px}.plist li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2)}.plist .ico{color:var(--brand);margin-top:1px}.plist.left{text-align:left}
.privacy{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin:18px 2px 6px;line-height:1.45}.privacy .ico{width:16px;height:16px;margin-top:1px}

/* ---------- Shell, nav with sliding indicator ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-brand,.nav-foot{display:none}
.nav-items{position:relative;display:flex;height:var(--nav-h);max-width:640px;margin:0 auto}
.navi{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:11px;gap:4px;font-size:11.5px;font-weight:650;color:var(--muted);transition:color .25s}
.navi .ico{width:22px;height:22px;transition:transform .3s var(--spring)}
.navi[aria-current]{color:var(--brand)}.navi[aria-current] .ico{transform:translateY(-1px)}
.navi .dot-badge{top:5px;right:calc(50% - 22px)}
.nav-ind{position:absolute;left:0;top:7px;width:60px;height:32px;border-radius:16px;background:var(--brand-soft);transform:translateX(calc(var(--x,0px) + var(--w,60px) / 2 - 30px));transition:transform .45s var(--spring),opacity .2s}
.screen{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.screen.enter>*{animation:enter .32s var(--ease) backwards}
.shell.intro .nav{animation:navin .7s var(--ease) backwards .15s}
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr-logo .logo{width:36px;height:36px;border-radius:10px}
.hdr-t{flex:1;min-width:0}.hdr-t p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-a{display:flex;gap:6px;align-items:center}
.content{padding:8px 16px 28px;max-width:1180px;margin:0 auto}
.content>.card+.card,.content>.card+.sec{margin-top:16px}.content.narrow{max-width:640px}.content.wide{max-width:1320px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:var(--side) 1fr}
  .nav{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);background:var(--surface);backdrop-filter:none;padding:18px 12px}
  .nav-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}.nav-brand b{display:block;font-size:16px;font-weight:800}.nav-brand small{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .nav-items{flex-direction:column;height:auto;gap:2px;margin:0;max-width:none}
  .navi{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;font-size:14.5px;border-radius:10px}
  .navi:hover:not([aria-current]){color:var(--ink)}
  .navi .dot-badge{position:static;margin-left:auto;box-shadow:none}
  .nav-ind{top:0;width:var(--w);height:var(--h);border-radius:10px;transform:translateY(var(--y,0px))}
  .nav-foot{display:block;margin-top:auto}
  .nav-user{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border-radius:12px;text-align:left}.nav-user:hover{background:var(--sunk)}
  .nav-user b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-user small{display:block;font-size:12px;color:var(--muted)}
  .shell.intro .nav{animation-name:navside}
  .screen{padding-bottom:0}
  .hdr{padding:22px 32px 14px}.hdr h1{font-size:24px}.hdr-logo{display:none}
  .content{padding:8px 32px 40px}
}

/* ---------- Map engine ---------- */
.sm-map{position:relative;overflow:hidden;background:var(--map-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;contain:strict}
.sm-map.grabbing{cursor:grabbing}.sm-map:focus-visible{box-shadow:inset 0 0 0 3px var(--focus)}
.sm-tiles,.sm-mk{position:absolute;inset:0}
.sm-tiles{z-index:0}
.sm-tile{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;transform-origin:0 0;opacity:0;transition:opacity .35s ease;pointer-events:none;user-select:none}
.sm-tile.in{opacity:1}
.sm-vec{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.sm-mk{z-index:2;pointer-events:none}
.sm-m{position:absolute;left:0;top:0;width:0;height:0;pointer-events:auto;will-change:transform}
.sm-attr{position:absolute;right:0;bottom:0;z-index:4;font-size:10.5px;line-height:1.4;padding:2px 7px;border-top-left-radius:7px;background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--muted)}
.sm-attr a{color:inherit}
.sm-ui{position:absolute;right:12px;top:var(--ctl-top,12px);z-index:5;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--sh-2);overflow:hidden}
.sm-ui button{width:42px;height:42px;display:grid;place-items:center;color:var(--ink-2);border-bottom:1px solid var(--line-2)}.sm-ui button:last-child{border-bottom:0}.sm-ui button:hover{background:var(--sunk)}
.smap{position:absolute;inset:0}
.smap.tracking::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--primary) 55%,transparent);animation:trackpulse 1.8s var(--ease) infinite}
@keyframes trackpulse{0%,100%{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--primary) 55%,transparent)}50%{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}}
.rt-case,.rt-line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt-case{stroke:var(--case);stroke-width:8.5;opacity:.92}.rt-line{stroke-width:4.5}
.rt{transition:opacity .35s}.rt.dim{opacity:.16}.rt.gone{display:none}
.stp{z-index:3;cursor:pointer}
.stp-dot{position:absolute;left:0;top:0;width:13px;height:13px;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;transition:transform .25s var(--spring),box-shadow .25s}

}

.dchart .bar.over{fill:var(--danger)}
.capline{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 5}

/* ---------- Sign in ---------- */

  .login-brand{display:flex;position:absolute;z-index:2;left:44px;top:40px;right:44px;align-items:center;gap:18px;color:#fff;animation:enter .8s var(--ease) backwards .2s}

/* ---------- Dialogs and toasts ---------- */
.scrim{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(9,16,28,.5);animation:fadein .2s ease}
.scrim.closing{animation:fadeout .22s ease forwards}
.dialog{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:6px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--sh-3);animation:sheetup .42s var(--spring)}
.scrim.closing .dialog{animation:sheetdown .22s ease forwards}
.dialog.wide{max-width:760px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.dialog{border-radius:22px;max-width:480px;padding:20px 22px 22px;animation-name:popin}.dialog.wide{max-width:760px}.grab{display:none}.scrim.closing .dialog{animation-name:popout}}
#toasts{position:fixed;z-index:300;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px));pointer-events:none}

.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--surface);box-shadow:var(--sh-3);animation:toastin .4s var(--spring)}

.toast-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:none}.toast-ico .ico{width:16px;height:16px}
.toast.ok .toast-ico{background:#22A162;color:#fff}.toast.danger .toast-ico{background:#D93A2B;color:#fff}
.toast.out{animation:toastout .3s ease forwards}

/* ---------- Motion ---------- */
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
@keyframes navin{from{transform:translateY(100%)}}@keyframes navside{from{transform:translateX(-24px);opacity:0}}
@keyframes sheetup{from{transform:translateY(100%)}}@keyframes sheetdown{to{transform:translateY(100%)}}
@keyframes popin{from{opacity:0;transform:scale(.95) translateY(8px)}}@keyframes popout{to{opacity:0;transform:scale(.97)}}
@keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.97)}}@keyframes toastout{to{opacity:0;transform:translateY(-8px)}}
@media (min-width:960px){@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.97)}}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes deplete{to{stroke-dashoffset:276.5}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2);opacity:0}}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(34,161,98,.55)}70%{box-shadow:0 0 0 7px rgba(34,161,98,0)}100%{box-shadow:0 0 0 0 rgba(34,161,98,0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 30%,transparent)}50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--brand) 0%,transparent)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes alarmbg{to{background:rgba(110,12,6,.92)}}

/* =================== Location: closest stop (runs on the device only) =================== */
const Locate = {
  last: null, // { lat, lng, acc, at } kept in memory only. Never saved to storage, never sent anywhere.
  fresh() { return this.last && Date.now() - this.last.at < 10 * MIN ? this.last : null; },
  ok() { return typeof navigator !== 'undefined' && 'geolocation' in navigator; },
  get() {
    return new Promise((res, rej) => {
      if (!this.ok()) { rej({ code: 0 }); return; }
      navigator.geolocation.getCurrentPosition(p => { this.last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0, at: Date.now() }; res(this.last); }, e => rej(e || { code: 2 }), { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 });
    });
  },
  dist(km) { return km < 1 ? `${Math.max(10, Math.round(km * 100) * 10)} m` : `${km.toFixed(km < 10 ? 1 : 0)} km`; },
  walk(km) { return km > 3 ? '' : `about ${Math.max(1, Math.round(km * 16.25))} min walk`; }, // 1.3x road factor at 80 m per minute
  near(km) { return [this.dist(km), this.walk(km)].filter(Boolean).join(', '); },
  err(e) { const c = e && e.code; return c === 1 ? 'Location is off for this site. Allow it in your browser settings, or pick a stop from the list.' : c === 0 ? 'This browser cannot share its location. Pick a stop from the list instead.' : c === 3 ? 'Finding you took too long. Try again in an open area, or pick a stop from the list.' : 'Could not work out where you are. Try again, or pick a stop from the list.'; },
  /* Stops sorted nearest first. `tie` (optional) breaks exact ties, e.g. two stops on the same spot, by who has the sooner shuttle. */
  rank(pos, ids, tie) { return ids.map(id => ({ id, km: hav(pos, STOPS[id]) })).sort((a, b) => (a.km - b.km) || ((tie ? tie(a.id) : 0) - (tie ? tie(b.id) : 0))); },
};

      onMount: (b, close) => {

  /* For the Book screen: closest stop that has something to book, plus the soonest departure from it. */

  nextOccurrence(cls, from = Date.now()) {

  /* Next class -> the latest shuttle that still gets the student there with time to walk (8 min) plus a 4 min buffer.
     Built from the bookable timetable (not live positions) so the trip it finds is one that can really be reserved. */
  suggestedTrip() {

    const now = Date.now();

SCREENS.book = el => {
  const D = App.draft;
  if (D.hold && Store.d.bookings.some(b => b.id === D.hold && b.status === 'held' && b.holdUntil < Date.now())) { Store.set(d => cleanupHolds(d)); D.hold = null; D.seat = null; toast('Seat hold expired', 'The seat went back to other riders. Pick a seat again.', 'danger'); }
  if (D.hold && !Store.d.bookings.find(b => b.id === D.hold)) D.hold = null;
  const step = D.done ? 4 : D.hold ? 3 : (D.trip && D.atSeat) ? 2 : 1;
  const stepper = `<ol class="stepper" aria-label="Booking progress">${['Trip', 'Seat', 'Payment', 'Ticket'].map((s, i) => `<li class="${i + 1 === step ? 'on' : i + 1 < step ? 'done' : ''}" ${i + 1 === step ? 'aria-current="step"' : ''}><span>${i + 1 < step ? icon('check') : i + 1}</span>${s}</li>`).join('')}</ol>`;
  const head = header('Reserve a seat', `Book anytime, up to ${BOOK_MAX_DAYS} days ahead`, bellBtn());

  if (step === 1) {
    const routes = liveRoutes().filter(r => routeVehicles(r.id).length && r.stops.length > 1);
    if (!D.route || !routes.some(r => r.id === D.route)) D.route = routes[0]?.id;
    const r = routeById(D.route);
    if (r && (!D.stop || !r.stops.includes(D.stop))) D.stop = r.stops.includes(Student.stop()) ? Student.stop() : r.stops[0];
    const lp = Locate.fresh();
    const days = Array.from({ length: BOOK_MAX_DAYS + 1 }, (_, i) => ({ i, t: startOfDay(Date.now()) + i * DAY + 12 * 3600e3 }));
    if (r && (D.day == null || !runsOn(r, days[D.day].t) || !tripsFor(r, D.day).some(t => boardTime(r, t.ts, D.stop) > Date.now()))) { const f = days.find(d => tripsFor(r, d.i).some(t => boardTime(r, t.ts, D.stop) > Date.now())); D.day = f ? f.i : 0; D.trip = null; }
    let trips = []; if (r) trips = tripsFor(r, D.day).map(t => ({ ...t, board: boardTime(r, t.ts, D.stop) })).filter(t => t.board > Date.now()).slice(0, 36);

    onMount: (body, close) => {

      };
    } });
}

const Driver = {
  me() { return driverById(App.s.id); },
  veh() { return Store.d.vehicles.find(v => v.driver === App.s.id); },
  trips(v) { const r = routeById(v.route); if (!r) return []; const now = Date.now(), R = sched(r).R; return [0, 1].flatMap(o => tripsFor(r, o)).filter(t => t.vehicle.id === v.id && t.ts + R * MIN > now - 2 * MIN).slice(0, 6); },
  pax(v, ts) { const id = tripId(v.route, ts); return Store.d.bookings.filter(b => b.trip === id && (b.status === 'booked' || b.status === 'boarded')).sort((a, b) => a.seat - b.seat); },
  alternatives(r) { const set = new Set(r.stops); return liveRoutes().filter(x => x.id !== r.id && serviceNow(x) && x.stops.some(s => set.has(s) && s !== HUB)).map(x => `Route ${x.id.slice(1)} also stops at ${x.stops.filter(s => set.has(s) && s !== HUB).map(s => STOPS[s].name).join(' and ')}.`).join(' '); },
  raise({ kind, cat, details, delay = 0, photo = null }) {
    const v = this.veh(), r = routeById(v.route), now = Date.now(), id = uid('INC');
    const affected = onboard(v) + Store.d.bookings.filter(b => b.route === v.route && b.status === 'booked' && boardTimeOf(b) > now && boardTimeOf(b) < now + 2 * 3600e3).length;
    Store.set(d => {
      const x = d.vehicles.find(y => y.id === v.id);
      d.incidents.unshift({ id, kind, cat, details, vehicle: v.id, route: r ? r.id : null, driver: App.s.id, at: now, status: 'open', delay, affected, photo });
      if (kind === 'emergency') setHold(x, null); else setHold(x, now + delay * MIN);
      if (r) {
        const alt = this.alternatives(r);
        if (kind === 'emergency') notify(d, { role: 'student', routes: [r.id] }, 'danger', `Route ${r.id.slice(1)} service stopped`, `${v.id} has stopped because of an emergency. Expect delays on Route ${r.id.slice(1)}.${alt ? ' ' + alt : ''}`);
        else notify(d, { role: 'student', routes: [r.id] }, 'warn', `Route ${r.id.slice(1)} running about ${delay} min late`, `${cat} affecting ${v.id}. Arrival times have been updated.${alt ? ' ' + alt : ''}`);
      }
      addLog(d, 'incident', `${kind === 'emergency' ? 'Emergency' : `Delay of ${delay} min`} reported on ${v.id}${r ? ` (Route ${r.id.slice(1)})` : ''}`);
    });
    return id;
  },
  sos() {
    const v = this.veh(); if (!v) return; let n = 5, timer;
    const dlg = openDialog({ label: 'Send SOS', closable: false, html: `<div class="sosd"><div class="sos-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><circle class="sr-v" cx="50" cy="50" r="44"/></svg><b class="num" id="sosn">5</b></div><h2>Sending SOS</h2><p class="muted">Fleet operations will see your location, vehicle and route straight away.</p><div class="stack" style="margin-top:20px"><button class="btn danger block lg" data-act="now">Send now</button><button class="btn ghost block lg" data-act="cancel">Cancel</button></div></div>` });
    const send = () => { clearInterval(timer); Driver.raise({ kind: 'emergency', cat: 'SOS', details: 'One-tap SOS from the driver.' }); vibrate([300, 100, 300]); $('.sosd', dlg.el).innerHTML = `${checkDraw()}<h2>SOS sent</h2><p class="muted" style="margin:6px 0 16px">Operations has been alerted. Stay with the vehicle if it is safe.</p><ul class="plist left"><li>${icon('power')}<span>Switch on hazard lights and keep passengers inside unless there is a fire or flood risk.</span></li><li>${icon('siren')}<span>For injuries or fire, call 999 now.</span></li><li>${icon('users')}<span>Count passengers and keep them together.</span></li></ul><button class="btn primary block" data-act="done" style="margin-top:16px">Done</button>`; };
    const el = $('.sosd', dlg.el); el.style.setProperty('--n', 5);
    timer = setInterval(() => { n--; const s = $('#sosn', dlg.el); if (s) s.textContent = n; if (n <= 0) send(); }, 1000);
    el.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act === 'cancel') { clearInterval(timer); dlg.close(); toast('SOS cancelled'); } if (a.dataset.act === 'now') send(); if (a.dataset.act === 'done') { dlg.close(); App.go('trip'); } });
  },
};
function resolveIncident(id, by = 'Operations') {
  Store.set(d => {
    const i = d.incidents.find(x => x.id === id); if (!i) return; i.status = 'resolved'; i.resolvedAt = Date.now(); i.by = by;
    const v = d.vehicles.find(x => x.id === i.vehicle); if (v && v.hold) clearHold(v);
    if (i.route) notify(d, { role: 'student', routes: [i.route] }, 'ok', `Route ${i.route.slice(1)} back to normal`, `${i.vehicle} is running again. Arrival times are up to date.`);
    addLog(d, 'incident', `${i.kind === 'emergency' ? 'Emergency' : 'Delay'} on ${i.vehicle} resolved`);
  });
}

function checkRider(q, v) {
  q = q.trim().toUpperCase().replace(/^KLUST:/, '');
  if (/^TKT-[A-Z0-9]{6}$/.test(q)) {
    const b = Store.d.bookings.find(x => x.id === q);
    if (!b) return { ok: false, why: 'Ticket not found' };
    if (b.status === 'cancelled') return { ok: false, why: 'This ticket was cancelled' };
    if (b.status === 'boarded') return { ok: false, why: 'This ticket has already been used' };
    if (b.status !== 'booked') return { ok: false, why: 'This ticket is not confirmed' };
    if (b.vehicle !== v.id) return { ok: false, why: `This ticket is for ${b.vehicle} on Route ${b.route.slice(1)}` };
    const bt = boardTimeOf(b); if (bt - Date.now() > 90 * MIN) return { ok: false, why: `This ticket is for the ${fmtTime(bt)} departure` };
    if (Date.now() - bt > 120 * MIN) return { ok: false, why: 'This ticket has expired' };
    return { ok: true, why: `Seat ${b.seat}`, b, cash: b.pay === 'cash' && !b.paid };
  }
  if (/^[A-Z]\d{2}[A-Z]{2}\d{4}$/.test(q)) { const u = Store.d.users[q]; if (!u) return { ok: false, why: 'Student ID not recognised' }; if (!u.eligible) return { ok: false, why: 'Not eligible to ride' }; return { ok: true, why: 'Walk-in rider, any free seat', walk: true }; }
  return { ok: false, why: 'Enter a ticket code like TKT-AB12CD or a student ID like A24KL0001', fmt: true };
}

      if (m.on && on.length === 1) { toast('Keep at least one option on', 'Turn another one on first, then remove this one.', 'danger'); return; }
      const open = Store.d.bookings.filter(b => b.pay === m.id && b.status === 'booked' && !b.paid).length;
      const ok = await confirmDialog({ title: `Remove ${esc(m.label)}?`, body: `It will disappear from checkout. Bookings already made with it are not affected${open ? `, and drivers can still collect on the ${open} seat${open === 1 ? '' : 's'} reserved with it` : ''}. You can add it back later.`, ok: 'Remove', danger: true });
      if (!ok) return;
      Store.set(d => { d.payMethods = d.payMethods.filter(x => x.id !== m.id); addLog(d, 'pay', `${m.label} removed from payment options`); });
      toast(`${m.label} removed`, '', 'ok', 2400); paint();
    }
  };
  return { onStore() { if (!$('.scrim')) paint(); } };
};

/* ---------- Insights: demand model + recommendations (FR14, fairness) ---------- */
SCREENS.insights = el => {
  const st = App.ui.ins || (App.ui.ins = { we: false, rid: null });
  const paint = () => {
    const routes = liveRoutes().filter(r => (st.we ? r.days !== 'wk' : r.days !== 'we') && routeVehicles(r.id).length);
    if (!routes.some(r => r.id === st.rid)) st.rid = routes[0]?.id || null; const r = routeById(st.rid);
    const H = Array.from({ length: 17 }, (_, i) => i + 6);
    let chart = emptyState('chart', 'No routes run on these days', 'Switch to the other day type.');
    if (r) {
      const cap = Admin.capHr(r), dem = H.map(h => r.days === 'we' && !st.we ? 0 : Admin.demand(r, h, st.we)), max = Math.max(cap, ...dem) * 1.15, W = 680, Hh = 220, bw = W / H.length;
      const y = v => Hh - v / max * Hh, peak = dem.indexOf(Math.max(...dem)), over = dem.filter(x => x > cap).length;
      chart = `<svg class="dchart" viewBox="0 -10 ${W} ${Hh + 40}" role="img" aria-label="Forecast riders per hour for Route ${r.id.slice(1)}">
        ${dem.map((v, i) => `<rect class="bar ${v > cap ? 'over' : ''}" x="${i * bw + 5}" y="${y(v)}" width="${bw - 10}" height="${Hh - y(v)}" rx="4" style="--c:${r.color};--d:${i * 30}ms"><title>${H[i]}:00, ${v} riders</title></rect>`).join('')}
        <line class="capline" x1="0" x2="${W}" y1="${y(cap)}" y2="${y(cap)}"/><text class="caplbl" x="${W - 4}" y="${y(cap) - 6}" text-anchor="end">${Math.round(cap)} seats an hour</text>
        ${H.map((h, i) => i % 2 === 0 ? `<text class="ax" x="${i * bw + bw / 2}" y="${Hh + 22}" text-anchor="middle">${h % 12 || 12}${h < 12 ? 'am' : 'pm'}</text>` : '').join('')}</svg>
        <p class="small muted" style="margin-top:6px">Busiest hour ${H[peak] % 12 || 12}${H[peak] < 12 ? 'am' : 'pm'} with about ${dem[peak]} riders. ${over ? `<b class="t-danger">${over} hour${over > 1 ? 's' : ''} over capacity.</b>` : 'Capacity covers forecast demand.'}</p>`;
    }
    const stops = [...new Set(routes.flatMap(x => x.stops))], hw = { hub: 1, rail: .75, major: .6, campus: .4 };
    const heat = stops.map(s => { const S = STOPS[s], w = S.hub ? hw.hub : S.rail ? hw.rail : S.major ? hw.major : s === 'UNIPARK' ? .22 : hw.campus; return { s, row: H.map(h => w * demandAt(h, st.we)) }; });
    el.innerHTML = header('Insights', 'Forecasts and suggestions. Nothing changes without your approval.') + `<div class="content wide">
      <section class="card"><div class="card-head wrap"><h3>Forecast riders per hour</h3><div class="seg sm">${[[false, 'Weekday'], [true, 'Weekend']].map(([k, l]) => `<button data-we="${k}" aria-pressed="${st.we === k}">${l}</button>`).join('')}</div></div>
        <div class="chips" style="margin:10px 0 12px">${routes.map(x => `<button class="chip" data-rid="${x.id}" aria-pressed="${x.id === st.rid}">${badge(x, 'xs')} ${esc(x.name)}</button>`).join('')}</div>${chart}</section>
      <section class="card"><div class="card-head"><h3>Boardings by stop and hour</h3><span class="small muted">Darker means busier</span></div><div class="heatwrap"><table class="heat"><thead><tr><th></th>${H.map(h => `<th>${h % 12 || 12}</th>`).join('')}</tr></thead><tbody>${heat.map(x => `<tr><th>${esc(STOPS[x.s].short || STOPS[x.s].name)}${x.s === 'UNIPARK' ? ` <span class="flag" title="Underserved area">${icon('flag')}</span>` : ''}</th>${x.row.map(v => `<td style="--v:${v.toFixed(2)}" title="${Math.round(v * 100)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">${icon('flag')}Flagged stops serve students with few other transport options. Low numbers there can mean poor service, not low need.</p></section>
      <h3 class="sec">Suggestions</h3><div class="recs">${Store.d.recs.map(x => `<article class="rec ${x.status} ${x.flag ? 'flagged' : ''}"><div class="row between"><span class="chip-s ${x.status === 'approved' ? 'ok' : x.status === 'rejected' ? '' : 'info'}">${x.status === 'pending' ? 'Needs review' : x.status === 'approved' ? 'Approved' : 'Rejected'}</span>${x.flag ? `<span class="chip-s warn">${icon('flag')}Fairness check</span>` : ''}</div><h4>${esc(x.title)}</h4><p>${esc(x.why)}</p><p class="small muted">${esc(x.impact)}</p>
        ${x.flag && x.status === 'pending' ? `<div class="fair">${icon('alert')}<p>${esc(x.fairness)}</p></div><label class="check"><input type="checkbox" data-ack="${x.id}"><span>I have reviewed the effect on Unipark residents</span></label>` : ''}
        ${x.status === 'pending' ? `<div class="row rec-a"><button class="btn sm ghost" data-rej="${x.id}">Reject</button><button class="btn sm primary" data-apr="${x.id}" ${x.flag ? 'disabled' : ''}>Approve</button></div>` : `<p class="tiny muted">${x.status === 'approved' ? 'Approved' : 'Rejected'} ${x.decidedAt ? ago(x.decidedAt) : ''}</p>`}</article>`).join('')}</div></div>`;
  };
  paint();
  el.onchange = e => { const a = e.target.closest('[data-ack]'); if (a) { const b = $(`[data-apr="${a.dataset.ack}"]`, el); if (b) b.disabled = !a.checked; } };
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.we) { st.we = b.dataset.we === 'true'; paint(); }
    if (b.dataset.rid) { st.rid = b.dataset.rid; paint(); }
    const id = b.dataset.apr || b.dataset.rej; if (!id) return; const ok = !!b.dataset.apr;
    Store.set(d => { const x = d.recs.find(y => y.id === id); x.status = ok ? 'approved' : 'rejected'; x.decidedAt = Date.now();
      if (ok && x.action.type === 'assign') { const v = d.vehicles.find(y => y.id === x.action.vehicle); if (v) { v.route = x.action.route; v.shiftMs = 0; v.hold = null; if (v.driver) notify(d, { role: 'driver', drivers: [v.driver] }, 'info', 'New route assignment', `${v.id} now runs Route ${x.action.route.slice(1)}.`); notify(d, { role: 'student', routes: [x.action.route] }, 'ok', `More trips on Route ${x.action.route.slice(1)}`, `${v.id} has joined Route ${x.action.route.slice(1)}, so shuttles come more often.`); } }
      addLog(d, 'rec', `Suggestion "${x.title}" ${ok ? 'approved' : 'rejected'}`); });
    toast(ok ? 'Suggestion approved' : 'Suggestion rejected', ok && Store.d.recs.find(y => y.id === id).action.type === 'assign' ? 'The fleet has been updated.' : '', ok ? 'ok' : ''); paint();
  };
  return { onStore: paint };
};
